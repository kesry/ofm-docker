name: Build and Push Docker Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: '分支/版本号（如 v2.8.0）'
        required: true
        default: 'v2.8.0'
        type: string
      arch:
        description: '目标架构'
        required: true
        default: 'amd64'
        type: choice
        options:
          - amd64
          - arm64

env:
  IMAGE_NAME: dsh-our-free-model
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set platform
        id: platform
        run: |
          if [ "${{ inputs.arch }}" = "amd64" ]; then
            echo "PLATFORM=linux/amd64" >> $GITHUB_OUTPUT
          else
            echo "PLATFORM=linux/arm64" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 构建并导出镜像 tar 包（不推送到 registry）
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ steps.platform.outputs.PLATFORM }}
          build-args: |
            VERSION=${{ inputs.version }}
          tags: ${{ env.IMAGE_NAME }}:${{ inputs.version }}-${{ inputs.arch }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          load: true

      # 上传镜像 tar 包作为构建产物
      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ inputs.arch }}
          path: ${{ runner.temp }}/image.tar
          retention-days: 7
